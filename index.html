<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Formula Green GP - Clean Text</title>
    <style>
        :root {
            --circuit-green: #2e7d32;
            --grass-border: #1b5e20;
            --gold: #ffd700;
            --dash-color: rgba(255, 255, 255, 0.3);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #050505;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111;
            padding: 10px 20px;
            border-bottom: 4px solid var(--circuit-green);
            border-radius: 12px 12px 0 0;
        }

        .timer-box {
            font-size: 2rem;
            font-weight: 900;
            color: var(--gold);
            font-family: 'Courier New', monospace;
            background: #000;
            padding: 2px 15px;
            border-radius: 8px;
            min-width: 100px;
            text-align: center;
        }

        .track {
            position: relative;
            flex-grow: 1;
            background-color: var(--circuit-green);
            border: 10px solid var(--grass-border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.7);
        }

        .vertical-dash-lines {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: linear-gradient(90deg, 
                var(--dash-color) 0%, 
                var(--dash-color) 10%, 
                transparent 10%, 
                transparent 100%
            );
            background-size: 150px 100%;
            z-index: 1;
            pointer-events: none;
        }

        .racing-active .vertical-dash-lines {
            animation: dash-scroll-left 0.08s linear infinite;
        }

        @keyframes dash-scroll-left {
            from { background-position: 0 0; }
            to { background-position: -150px 0; }
        }

        .lane {
            position: relative;
            flex: 1;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            z-index: 2;
        }

        /* Label Nama Bersih Tanpa Blok */
        .static-label {
            position: absolute;
            left: 15px;
            width: 100px;
            font-size: 13px;
            font-weight: 900;
            /* Warna diatur via inline style di JS */
            z-index: 50;
            text-transform: uppercase;
            pointer-events: none;
            /* Memberikan sedikit bayangan teks agar terbaca di rumput */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 0.5px;
            border-left: 3px solid currentColor;
            padding-left: 8px;
        }

        .finish-line {
            position: absolute;
            right: -150px;
            top: 0;
            bottom: 0;
            width: 70px;
            background: repeating-conic-gradient(#fff 0% 25%, #000 0% 50%) 50% / 17.5px 17.5px;
            border-left: 10px solid #ff3131;
            z-index: 15;
            display: none;
        }

        .finish-line.active {
            display: block;
            animation: finish-rush-left 2.5s linear forwards;
        }

        @keyframes finish-rush-left {
            0% { right: -150px; }
            100% { right: 130%; }
        }

        .car {
            position: absolute;
            left: 130px; 
            width: 90px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform;
            z-index: 20;
        }

        .car-body {
            width: 85px;
            height: 35px;
            filter: drop-shadow(0 6px 4px rgba(0,0,0,0.5));
        }

        .racing-active .car-body {
            animation: car-shake 0.04s infinite alternate;
        }

        @keyframes car-shake {
            from { transform: translateY(-0.8px); }
            to { transform: translateY(0.8px); }
        }

        .announcer {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 8rem;
            font-weight: 900;
            z-index: 200;
            pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0 0 40px rgba(0,0,0,0.8);
            font-style: italic;
        }
        .announcer.visible { transform: translate(-50%, -50%) scale(1); }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow-y: auto;
            padding: 20px 0;
        }

        .setup-card {
            background: #111;
            padding: 25px;
            border-radius: 20px;
            border: 2px solid var(--circuit-green);
            max-width: 500px;
            width: 90%;
        }

        .name-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .input-group label {
            font-size: 10px;
            color: #888;
            margin-bottom: 2px;
        }

        .input-group input {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .btn {
            background: linear-gradient(135deg, #4caf50, #1b5e20);
            color: white;
            border: none;
            padding: 14px 45px;
            font-size: 1.4rem;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 10px;
        }

        .rank-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            margin: 8px 0;
            background: #1a1a1a;
            border-radius: 10px;
            font-weight: bold;
        }
        .first-place { border: 1px solid var(--gold); color: var(--gold); }
    </style>
</head>
<body>

    <div id="announcer" class="announcer">GO!</div>

    <div id="start-modal" class="modal">
        <div class="setup-card">
            <h1 style="font-size: 2.2rem; color: #4caf50; margin: 0; font-style: italic;">GREEN LEAF GP</h1>
            <p style="color: #aaa; margin: 5px 0 20px;">Teks Bersih | Musik Detik ke-1</p>
            
            <div class="name-inputs" id="name-inputs-container"></div>

            <button class="btn" onclick="startRaceSequence()">GAS POL!</button>
        </div>
    </div>

    <div id="finish-modal" class="modal" style="display: none;">
        <div class="setup-card">
            <h2 style="color: #4caf50; font-size: 1.8rem;">🏁 HASIL BALAPAN 🏁</h2>
            <div id="results"></div>
            <button class="btn" style="font-size: 1.1rem;" onclick="location.reload()">COBA LAGI</button>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <div style="font-weight: 900; letter-spacing: 2px; color: #4caf50;">ULTRA FORMULA GP</div>
            <div id="timer" class="timer-box">01:00</div>
        </div>

        <div class="track" id="track">
            <div class="vertical-dash-lines"></div>
            <div id="finish-line" class="finish-line"></div>
            <div id="lanes-container" style="height: 100%; display: flex; flex-direction: column;"></div>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let musicNodes = [];
        let musicGain;

        const carColors = ["#e6194b", "#3cb44b", "#ffe119", "#4363d8", "#f58231", "#911eb4", "#42d4f4", "#ffffff"];
        const defaultNames = ["FERRARI", "MERCEDES", "RED BULL", "MCLAREN", "ASTON", "ALPINE", "WILLIAMS", "HAAS"];
        
        let cars = [];
        let isRacing = false;
        let timeLeft = 60;
        let startTs;
        let animRef, timerRef;

        const inputContainer = document.getElementById('name-inputs-container');
        defaultNames.forEach((name, i) => {
            const group = document.createElement('div');
            group.className = 'input-group';
            group.innerHTML = `
                <label>PENGEMUDI ${i+1}</label>
                <input type="text" id="input-name-${i}" value="${name}" maxlength="12">
            `;
            inputContainer.appendChild(group);
        });

        function playRacingMusic() {
            const tempo = 150;
            const secondsPerBeat = 60 / tempo;
            
            musicGain = audioCtx.createGain();
            musicGain.gain.setValueAtTime(0, audioCtx.currentTime);
            musicGain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.5);
            musicGain.connect(audioCtx.destination);
            
            const bassline = [110, 110, 146, 146, 164, 164, 110, 110]; 
            const melody = [440, 493, 523, 587, 659, 783, 659, 587];

            function playNote(freq, time, duration, type='square', vol=0.1) {
                if (freq === 0) return;
                const osc = audioCtx.createOscillator();
                const noteGain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, time);
                noteGain.gain.setValueAtTime(vol, time);
                noteGain.gain.exponentialRampToValueAtTime(0.001, time + duration);
                osc.connect(noteGain);
                noteGain.connect(musicGain);
                osc.start(time);
                osc.stop(time + duration);
                musicNodes.push(osc);
            }

            let currTime = audioCtx.currentTime;
            for (let i = 0; i < 200; i++) {
                const bNote = bassline[i % bassline.length];
                const mNote = melody[i % melody.length];
                playNote(bNote, currTime + (i * secondsPerBeat), secondsPerBeat * 0.9, 'sawtooth', 0.15);
                if (i % 2 === 0) playNote(mNote, currTime + (i * secondsPerBeat), secondsPerBeat * 0.5, 'square', 0.1);
            }
        }

        function stopMusic() {
            if (musicGain) {
                musicGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1);
            }
            setTimeout(() => {
                musicNodes.forEach(node => { try { node.stop(); } catch(e) {} });
            }, 1200);
        }

        const lanesContainer = document.getElementById('lanes-container');
        function setupGrid() {
            lanesContainer.innerHTML = '';
            cars = [];
            for(let i=0; i<8; i++) {
                const customName = document.getElementById(`input-name-${i}`).value || `TIM ${i+1}`;
                const lane = document.createElement('div');
                lane.className = 'lane';
                lane.innerHTML = `
                    <div class="static-label" style="color: ${carColors[i]}">${customName}</div>
                    <div class="car" id="car-${i}">
                        <span id="medal-${i}" style="position:absolute; top:-35px; font-size:24px; display:none; z-index:30;"></span>
                        <svg class="car-body" viewBox="0 0 120 40">
                            <rect x="20" y="3" width="18" height="8" fill="#000" rx="2" />
                            <rect x="20" y="29" width="18" height="8" fill="#000" rx="2" />
                            <rect x="85" y="5" width="12" height="6" fill="#000" rx="1" />
                            <rect x="85" y="29" width="12" height="6" fill="#000" rx="1" />
                            <path d="M10 12 L35 8 L95 14 L115 20 L95 26 L35 32 L10 28 Z" fill="${carColors[i]}" />
                            <rect x="5" y="10" width="6" height="20" fill="#111" />
                            <ellipse cx="60" cy="20" rx="12" ry="5" fill="rgba(0,0,0,0.8)" />
                            <rect x="105" y="12" width="10" height="16" fill="${carColors[i]}" />
                        </svg>
                    </div>
                `;
                lanesContainer.appendChild(lane);

                cars.push({
                    id: i,
                    name: customName,
                    color: carColors[i],
                    el: document.getElementById(`car-${i}`),
                    pos: 130, 
                    seed: Math.random() * 5000,
                    finished: false,
                    finishTime: 0,
                    target: 56.5 + (Math.random() * 3.2)
                });
            }
        }

        function playSFX(f, type, d, v=0.05) {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = type; o.frequency.setValueAtTime(f, audioCtx.currentTime);
            g.gain.setValueAtTime(v, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + d);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + d);
        }

        function announce(txt, clr="#fff") {
            const el = document.getElementById('announcer');
            el.innerText = txt;
            el.style.color = clr;
            el.classList.add('visible');
            setTimeout(() => el.classList.remove('visible'), 1200);
        }

        function startRaceSequence() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            setupGrid();
            document.getElementById('start-modal').style.display = 'none';
            
            let count = 3;
            const cd = setInterval(() => {
                if(count > 0) {
                    playSFX(440, 'sine', 0.2, 0.15);
                    announce(count, "#ffd700");
                    if (count === 1) playRacingMusic();
                } else {
                    clearInterval(cd);
                    playSFX(880, 'sine', 0.6, 0.2);
                    announce("GO!", "#4caf50");
                    startEngine();
                }
                count--;
            }, 1000);
        }

        function startEngine() {
            isRacing = true;
            document.getElementById('track').classList.add('racing-active');
            startTs = performance.now();
            
            timerRef = setInterval(() => {
                timeLeft--;
                const m = Math.floor(timeLeft / 60);
                const s = timeLeft % 60;
                document.getElementById('timer').innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                
                if(timeLeft === 4) {
                    const fl = document.getElementById('finish-line');
                    fl.style.display = 'block';
                    fl.classList.add('active');
                }

                if(timeLeft <= 0) finalize();
            }, 1000);

            requestAnimationFrame(update);
        }

        function update(now) {
            if(!isRacing) return;
            const elapsed = now - startTs;
            const trackWidth = document.getElementById('track').clientWidth;
            const startPos = 130;
            const maxDriveWidth = (trackWidth - startPos) * 0.75;

            cars.forEach(c => {
                if(c.finished) return;

                const sway = Math.sin(elapsed / 1100 + c.seed) * 50;
                const progress = elapsed / (c.target * 1000);
                let currentPos = startPos + (progress * maxDriveWidth) + sway;

                if(elapsed >= (c.target * 1000)) {
                    c.finished = true;
                    c.finishTime = (elapsed / 1000).toFixed(2);
                    rank(c);
                }

                c.pos = currentPos;
                c.el.style.transform = `translateX(${c.pos - startPos}px)`;
            });

            if(cars.every(c => c.finished)) finalize();
            else animRef = requestAnimationFrame(update);
        }

        let order = 0;
        function rank(car) {
            order++;
            if(order <= 3) {
                const medals = ["🥇", "🥈", "🥉"];
                const tag = document.getElementById(`medal-${car.id}`);
                tag.innerText = medals[order-1];
                tag.style.display = "block";
                playSFX(600 + (3-order)*100, 'sine', 0.5, 0.1);
                if(order === 1) announce(car.name, car.color);
            }
        }

        function finalize() {
            isRacing = false;
            clearInterval(timerRef);
            cancelAnimationFrame(animRef);
            stopMusic(); 
            document.getElementById('track').classList.remove('racing-active');
            
            setTimeout(() => {
                const sorted = [...cars].sort((a,b) => a.finishTime - b.finishTime);
                const res = document.getElementById('results');
                res.innerHTML = sorted.slice(0, 5).map((c, i) => `
                    <div class="rank-row ${i==0?'first-place':''}">
                        <span>${i+1}. ${c.name}</span>
                        <span>${c.finishTime}s</span>
                    </div>
                `).join('');
                document.getElementById('finish-modal').style.display = 'flex';
                playSFX(250, 'square', 1.5, 0.1);
            }, 1000);
        }
    </script>
</body>
</html>
