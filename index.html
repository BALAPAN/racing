<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spin Hero MLBB - Final Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;900&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #020617; 
            color: white;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-tap-highlight-color: transparent;
        }

        /* Indikator Panah */
        .arrow-down {
            width: 0; height: 0; 
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 24px solid #facc15; 
            filter: drop-shadow(0 0 10px rgba(250, 204, 21, 0.9));
            z-index: 30;
        }

        canvas {
            filter: drop-shadow(0 0 20px rgba(37, 99, 235, 0.4));
            max-width: 100%;
            height: auto !important;
            touch-action: none;
        }

        /* Toggle Switch Style */
        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1e293b; transition: .3s; border-radius: 18px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 14px; width: 14px; left: 2px; bottom: 2px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #fbbf24; }
        input:checked + .slider:before { transform: translateX(16px); }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
        }
        .modal-content {
            background-color: #0f172a;
            margin: 5% auto;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            border-radius: 24px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.6); }
            70% { box-shadow: 0 0 0 12px rgba(250, 204, 21, 0); }
            100% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0); }
        }
        .active-music { animation: pulse-gold 2s infinite; }

        .loader {
            border: 2px solid #1e293b;
            border-top: 2px solid #fbbf24;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .stats-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header class="w-full py-3 px-5 flex justify-between items-center bg-slate-900/80 border-b border-white/5 z-10 sticky top-0">
        <div class="flex items-center gap-3">
            <button id="openEditBtn" class="p-2 bg-slate-800 rounded-xl active:scale-90 transition-transform border border-slate-700">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
            </button>
            <h1 class="text-xs font-black tracking-tighter italic uppercase text-white">MLBB <span class="text-amber-400 font-extrabold">SPIN</span></h1>
        </div>
        <div class="flex items-center gap-4">
            <button id="aiPickBtn" class="px-3 py-1.5 bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 rounded-lg active:scale-95 transition-all flex items-center gap-2">
                <span class="text-[10px] font-black uppercase tracking-tight">AI ✨</span>
            </button>
            <button id="audioToggleBtn" class="p-2 bg-slate-800 text-amber-400 rounded-full active:scale-95 transition-all border border-slate-700">
                <svg id="audioIconOn" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                <svg id="audioIconOff" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2V15H6L11 19V5Z"></path><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
            </button>
            <label class="switch">
                <input type="checkbox" id="autoToggle">
                <span class="slider"></span>
            </label>
        </div>
    </header>

    <main class="flex-1 flex flex-col justify-between p-4 pb-8 overflow-hidden">
        
        <!-- Papan Skor & Pemenang -->
        <div class="flex gap-3 h-[14vh] max-h-[110px]">
            <div id="resultCard" class="flex-1 stats-card rounded-2xl p-3 border-b-4 border-amber-500/40 flex flex-col justify-center items-center text-center shadow-lg">
                <p class="text-[9px] text-amber-400 font-black uppercase tracking-[0.15em] mb-1">Pemenang</p>
                <div class="flex items-center gap-2 overflow-hidden">
                    <span id="winnerIcon" class="hidden text-lg">🏆</span>
                    <h2 id="winnerName" class="text-sm font-black text-white truncate uppercase italic tracking-tighter">---</h2>
                </div>
                <span id="timerText" class="text-[8px] text-slate-500 font-mono mt-1 opacity-70 italic tracking-widest">READY</span>
            </div>

            <div class="flex-1 stats-card rounded-2xl p-3 border-b-4 border-blue-500/40 flex flex-col justify-center overflow-hidden shadow-lg">
                <div class="flex justify-between items-center mb-1.5">
                    <p class="text-[9px] text-slate-400 font-black uppercase tracking-tight">Peringkat</p>
                    <button id="resetStats" class="text-[9px] text-red-500 font-black hover:text-red-400 transition-colors uppercase">Reset</button>
                </div>
                <div id="leaderboard" class="flex flex-col gap-1.5">
                    <p class="text-[9px] text-slate-600 italic text-center py-1">Belum ada data</p>
                </div>
            </div>
        </div>

        <!-- Area Roda Keberuntungan -->
        <div class="relative flex-1 flex flex-col items-center justify-center py-4">
            <div class="absolute top-0 transform z-20">
                <div class="arrow-down"></div>
            </div>
            <div class="p-1.5 bg-slate-800 rounded-full shadow-[0_0_50px_rgba(0,0,0,0.8)] border-4 border-slate-700 ring-8 ring-slate-900/40 relative">
                <canvas id="wheelCanvas" width="500" height="500" class="w-[72vw] h-[72vw] max-w-[340px] max-h-[340px]"></canvas>
            </div>
        </div>

        <!-- Kontrol Utama -->
        <div class="flex flex-col gap-4">
            <div class="text-center">
                <p class="text-[10px] font-black text-slate-500 uppercase tracking-[0.3em]">Total Spin: <span id="totalSpins" class="text-amber-500 text-xs">0</span></p>
            </div>
            <button id="spinBtn" class="w-full py-5 bg-gradient-to-r from-blue-700 to-blue-500 active:scale-95 active:shadow-none text-white font-black rounded-2xl shadow-[0_6px_0_rgb(29,78,216)] transition-all text-base uppercase tracking-[0.25em] flex items-center justify-center gap-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/></svg>
                <span>PUTAR</span>
            </button>
        </div>
    </main>

    <!-- Modal Edit Hero -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-5 border-b border-slate-800 pb-3">
                <h2 class="text-sm font-black text-amber-400 uppercase tracking-widest">Kelola Hero</h2>
                <button id="closeEditBtn" class="text-slate-500 text-3xl leading-none">&times;</button>
            </div>
            <div id="editList" class="space-y-3 mb-5 pr-1"></div>
            <button id="addItemBtn" class="w-full py-3 mb-5 border-2 border-dashed border-slate-700 rounded-xl text-[10px] font-black text-slate-500 transition-all hover:border-amber-500 hover:text-amber-500 active:bg-slate-800 uppercase">+ Hero Manual</button>
            <div class="flex gap-3">
                <button id="saveEditBtn" class="flex-1 py-4 bg-blue-600 hover:bg-blue-500 text-white text-[11px] font-black rounded-xl uppercase tracking-widest shadow-lg">Simpan</button>
                <button id="cancelEditBtn" class="flex-1 py-4 bg-slate-800 text-slate-400 text-[11px] font-black rounded-xl uppercase tracking-widest">Batal</button>
            </div>
        </div>
    </div>

    <!-- Modal AI Strategist -->
    <div id="aiModal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-5 border-b border-slate-800 pb-3">
                <h2 class="text-sm font-black text-indigo-400 uppercase tracking-widest">AI Strategist ✨</h2>
                <button id="closeAiBtn" class="text-slate-500 text-3xl leading-none">&times;</button>
            </div>
            <div class="flex gap-2 mb-6">
                <input id="aiPromptInput" type="text" placeholder="Contoh: Hero counter Fanny..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs outline-none text-white focus:ring-2 focus:ring-indigo-500/50 transition-all">
                <button id="submitAiBtn" class="bg-indigo-500 hover:bg-indigo-400 text-white px-5 py-2 rounded-xl text-[10px] font-black uppercase flex items-center gap-2 shadow-lg">GAS <div id="aiLoader" class="loader"></div></button>
            </div>
            <div class="space-y-3">
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Saran Cepat:</p>
                <div class="flex flex-wrap gap-2">
                    <button class="ai-chip bg-slate-800/80 hover:bg-indigo-600/30 text-[10px] px-3 py-2 rounded-lg border border-slate-700 transition-colors" data-prompt="Hero META terbaru MLBB">META Saat Ini</button>
                    <button class="ai-chip bg-slate-800/80 hover:bg-indigo-600/30 text-[10px] px-3 py-2 rounded-lg border border-slate-700 transition-colors" data-prompt="Hero role Fighter paling kuat">Fighter OP</button>
                    <button class="ai-chip bg-slate-800/80 hover:bg-indigo-600/30 text-[10px] px-3 py-2 rounded-lg border border-slate-700 transition-colors" data-prompt="Hero Assassin mekanik tinggi">Assasins Sulit</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API Key untuk AI (Kosongkan di sini jika ingin menggunakan default browser)
        const apiKey = ""; 
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const autoToggle = document.getElementById('autoToggle');
        const winnerDisplay = document.getElementById('winnerName');
        const winnerIcon = document.getElementById('winnerIcon');
        const totalSpinsDisplay = document.getElementById('totalSpins');
        const timerText = document.getElementById('timerText');
        const leaderboard = document.getElementById('leaderboard');
        const audioToggleBtn = document.getElementById('audioToggleBtn');
        
        const editModal = document.getElementById('editModal');
        const editList = document.getElementById('editList');
        const addItemBtn = document.getElementById('addItemBtn');

        // --- SISTEM AUDIO ---
        let audioCtx = null;
        let isAudioOn = false;
        let isMusicPlaying = false;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playNote(freq, type, startTime, duration, vol) {
            if (!audioCtx || !isAudioOn) return;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, startTime);
            g.gain.setValueAtTime(vol, startTime);
            g.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
            osc.connect(g);
            g.connect(audioCtx.destination);
            osc.start(startTime);
            osc.stop(startTime + duration);
        }

        function playMLBBTheme() {
            if (!isAudioOn || !isMusicPlaying || !audioCtx) return;
            const now = audioCtx.currentTime;
            // Melodi Epic Minimalis
            const melody = [
                {f:261,d:0.4,v:0.06}, {f:392,d:0.4,v:0.06}, 
                {f:349,d:0.3,v:0.06}, {f:261,d:0.6,v:0.08},
                {f:392,d:0.4,v:0.06}, {f:523,d:0.4,v:0.06},
                {f:466,d:0.3,v:0.06}, {f:392,d:0.6,v:0.08}
            ];
            let offset = 0;
            melody.forEach(n => {
                playNote(n.f, 'triangle', now + offset, n.d, n.v);
                offset += n.d + 0.05;
            });
            setTimeout(() => { if(isMusicPlaying) playMLBBTheme(); }, offset * 1000 + 1500);
        }

        function playTick() {
            if (!isAudioOn || !audioCtx) return;
            playNote(900, 'sine', audioCtx.currentTime, 0.04, 0.02);
        }

        function playWinFanfare() {
            if (!isAudioOn || !audioCtx) return;
            const now = audioCtx.currentTime;
            playNote(523, 'square', now, 0.2, 0.07);
            playNote(659, 'square', now + 0.15, 0.2, 0.07);
            playNote(784, 'square', now + 0.3, 0.5, 0.09);
        }

        audioToggleBtn.onclick = () => {
            initAudio();
            isAudioOn = !isAudioOn;
            isMusicPlaying = isAudioOn;
            audioToggleBtn.classList.toggle('active-music', isAudioOn);
            document.getElementById('audioIconOn').classList.toggle('hidden', !isAudioOn);
            document.getElementById('audioIconOff').classList.toggle('hidden', isAudioOn);
            if (isAudioOn) playMLBBTheme();
        };

        // --- MESIN RODA ---
        let segments = [
            { text: "GUSION", color: "#1e3a8a" }, { text: "FANNY", color: "#991b1b" },            
            { text: "CHOU", color: "#92400e" }, { text: "LANCELOT", color: "#1e40af" },        
            { text: "SELENA", color: "#5b21b6" }, { text: "LING", color: "#065f46" }
        ];

        let winStats = {};
        let totalSpinsCount = 0;
        let currentRotation = 0; 
        let isSpinning = false;
        let lastTickSegment = -1;

        function drawWheel() {
            const arc = (2 * Math.PI) / segments.length;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            segments.forEach((s, i) => {
                const angle = currentRotation + i * arc;
                ctx.beginPath();
                ctx.moveTo(250, 250);
                ctx.arc(250, 250, 245, angle, angle + arc);
                ctx.fillStyle = s.color;
                ctx.fill();
                
                // Draw text
                ctx.save();
                ctx.translate(250, 250);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "white";
                ctx.font = `900 ${segments.length > 12 ? '10px' : '14px'} Poppins`;
                ctx.fillText(s.text, 225, 5);
                ctx.restore();
            });
            
            // Center Dot
            ctx.beginPath();
            ctx.arc(250, 250, 32, 0, Math.PI * 2);
            ctx.fillStyle = "#020617";
            ctx.fill();
            ctx.strokeStyle = "#fbbf24";
            ctx.lineWidth = 5;
            ctx.stroke();
        }

        function spin() {
            if (isSpinning) return;
            initAudio();
            isSpinning = true;
            spinBtn.disabled = true;
            winnerDisplay.textContent = "MEMUTAR...";
            winnerIcon.classList.add('hidden');
            
            const startRot = currentRotation;
            const extraRot = (Math.PI * 2 * (15 + Math.random() * 10));
            const duration = 4500;
            const start = performance.now();

            function anim(time) {
                const elapsed = time - start;
                const p = Math.min(elapsed / duration, 1);
                // Cubic easing
                const eased = 1 - Math.pow(1 - p, 4);
                currentRotation = startRot + (extraRot * eased);
                
                const arc = (2 * Math.PI) / segments.length;
                const currentSegment = Math.floor(((3 * Math.PI / 2 - currentRotation) % (2 * Math.PI)) / arc);
                if (currentSegment !== lastTickSegment) {
                    playTick();
                    lastTickSegment = currentSegment;
                }
                drawWheel();
                
                if (p < 1) requestAnimationFrame(anim);
                else {
                    isSpinning = false;
                    const idx = (Math.floor(((3 * Math.PI / 2 - currentRotation) % (2 * Math.PI)) / arc) + segments.length) % segments.length;
                    const win = segments[idx];
                    winnerDisplay.textContent = win.text;
                    winnerIcon.classList.remove('hidden');
                    totalSpinsCount++;
                    totalSpinsDisplay.textContent = totalSpinsCount;
                    winStats[win.text] = (winStats[win.text] || 0) + 1;
                    renderStats();
                    playWinFanfare();
                    
                    if (autoToggle.checked) {
                        setTimeout(() => { if(autoToggle.checked) spin(); }, 2000);
                    } else {
                        spinBtn.disabled = false;
                    }
                }
            }
            requestAnimationFrame(anim);
        }

        function renderStats() {
            const sorted = Object.entries(winStats).sort((a,b) => b[1] - a[1]).slice(0, 3);
            const medals = ["🥇", "🥈", "🥉"];
            leaderboard.innerHTML = sorted.map(([n, c], i) => `
                <div class="flex justify-between items-center text-[10px] font-black italic">
                    <span class="text-white truncate flex items-center gap-2">
                        <span class="text-sm grayscale-0">${medals[i]}</span> ${n}
                    </span>
                    <span class="text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded-md border border-amber-500/20">${c}</span>
                </div>
            `).join('') || '<p class="text-[9px] text-slate-600 italic text-center py-1">Belum ada data</p>';
        }

        // --- MANAJEMEN EDIT ---
        function createEditRow(name = "HERO", color = "#3b82f6") {
            const div = document.createElement('div');
            div.className = 'flex items-center gap-3 bg-slate-800/40 p-2.5 rounded-xl border border-slate-700/50 group transition-all hover:bg-slate-800';
            div.innerHTML = `
                <input type="color" value="${color}" class="w-7 h-7 bg-transparent border-0 cursor-pointer rounded-lg overflow-hidden">
                <input type="text" value="${name}" class="flex-1 bg-transparent border-b border-slate-700 text-[11px] text-white uppercase outline-none focus:border-amber-400 font-bold">
                <button class="text-red-500/60 hover:text-red-500 px-2 font-bold text-xl transition-colors active:scale-125">&times;</button>
            `;
            div.querySelector('button').onclick = () => div.remove();
            return div;
        }

        addItemBtn.onclick = () => {
            const colors = ["#ef4444", "#3b82f6", "#10b981", "#f59e0b", "#8b5cf6", "#ec4899"];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const newRow = createEditRow("HERO BARU", randomColor);
            editList.appendChild(newRow);
            editList.scrollTop = editList.scrollHeight;
        };

        document.getElementById('openEditBtn').onclick = () => {
            editList.innerHTML = '';
            segments.forEach(s => editList.appendChild(createEditRow(s.text, s.color)));
            editModal.style.display = 'block';
        };

        document.getElementById('saveEditBtn').onclick = () => {
            const news = [];
            editList.querySelectorAll('div').forEach(row => {
                const ins = row.querySelectorAll('input');
                const t = ins[1].value.trim().toUpperCase();
                if (t) news.push({ text: t, color: ins[0].value });
            });
            if (news.length >= 2) { 
                segments = news; 
                drawWheel(); 
                editModal.style.display = 'none'; 
            } else {
                alert("Minimal dibutuhkan 2 hero untuk berputar!");
            }
        };

        // --- INTEGRASI AI ---
        async function fetchAiHeroes(prompt) {
            initAudio();
            const loader = document.getElementById('aiLoader');
            loader.style.display = 'inline-block';
            const sys = "Daftar hero MLBB. HANYA kembalikan JSON array: [{\"text\":\"NAME\",\"color\":\"#HEX\"}]. Maksimal 12 hero.";
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: sys }] },
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });
                const res = await response.json();
                const news = JSON.parse(res.candidates[0].content.parts[0].text);
                if (Array.isArray(news) && news.length >= 2) { 
                    segments = news; 
                    drawWheel(); 
                    document.getElementById('aiModal').style.display = 'none'; 
                }
            } catch (e) { 
                console.error("Gagal memuat AI:", e); 
            } finally { 
                loader.style.display = 'none'; 
            }
        }

        document.getElementById('aiPickBtn').onclick = () => document.getElementById('aiModal').style.display = 'block';
        document.getElementById('closeAiBtn').onclick = () => document.getElementById('aiModal').style.display = 'none';
        document.getElementById('submitAiBtn').onclick = () => fetchAiHeroes(document.getElementById('aiPromptInput').value);
        document.querySelectorAll('.ai-chip').forEach(c => c.onclick = () => fetchAiHeroes(c.dataset.prompt));
        document.getElementById('closeEditBtn').onclick = () => editModal.style.display = 'none';
        document.getElementById('cancelEditBtn').onclick = () => editModal.style.display = 'none';
        document.getElementById('resetStats').onclick = () => { 
            winStats = {}; 
            renderStats(); 
            totalSpinsCount = 0; 
            totalSpinsDisplay.textContent = "0"; 
        };
        spinBtn.onclick = spin;

        // Gambar roda pertama kali
        window.onload = drawWheel;
    </script>
</body>
</html>
